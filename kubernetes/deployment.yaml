apiVersion: apps/v1
kind: Deployment

metadata:
  name: heart-disease-api
  labels:
    app: heart-disease-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: heart-disease-api

  template:
    metadata:
      labels:
        app: heart-disease-api

    spec:
      containers:
        - name: heart-disease-api
          image: docker.io/2025ae05122/heart-disease-api:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000

          env:
            - name: MODEL_PATH
              value: /opt/app/artifacts/heart_disease_pipeline.joblib

            - name: LOG_LEVEL
              value: INFO

          readinessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi