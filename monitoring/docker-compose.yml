services:
  heart-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: heart-api

    ports:
      - "8000:8000"

    environment:
      MODEL_PATH: /opt/app/artifacts/heart_disease_pipeline.joblib
      LOG_LEVEL: INFO

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: heart-prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    depends_on:
      - heart-api

    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: heart-grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    restart: unless-stopped