services:
  heart-api:
    image: docker.io/2025ae05122/heart-disease-api:latest
    pull_policy: always
    container_name: heart-api

    ports:
      - "8000:8000"

    environment:
      MODEL_PATH: /opt/app/artifacts/heart_disease_pipeline.joblib
      LOG_LEVEL: INFO

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: heart-prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    ports:
      - "9090:9090"

    depends_on:
      - heart-api

    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: heart-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data: